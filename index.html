<style>
:root{
  --bg:#EDF3F2; --surface:#FFFFFF; --sunk:#E2ECEA; --ink:#10292E; --muted:#4D6468; --line:#CFDDDB;
  --btn:#C4EEF3; --btn-ink:#0B4A54; --brand:#0F5F6B;
  --comb:#C2372A; --comb-deep:#B8322A; --comb-soft:#FBE3DF; --straw:#B87B0C; --straw-soft:#FBEFD4; --ok:#2E7A4E;
  --on-selected:#FFFFFF;
  --r-s:10px; --r-m:16px; --r-l:24px;
  --display:"Bricolage Grotesque", "Noto Sans SC", system-ui, sans-serif;
  --body:"Noto Sans", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A1C; --surface:#12262A; --sunk:#0F2023; --ink:#E3EEEC; --muted:#93AAAD; --line:#22393D;
    --btn:#174B53; --btn-ink:#D6F5F8; --brand:#7FD3DE;
    --comb:#F06B5B; --comb-deep:#A3302A; --comb-soft:#3A1D1A; --straw:#EDB94F; --straw-soft:#35290F; --ok:#6CC592;
    --on-selected:#0B1A1C;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A1C; --surface:#12262A; --sunk:#0F2023; --ink:#E3EEEC; --muted:#93AAAD; --line:#22393D;
  --btn:#174B53; --btn-ink:#D6F5F8; --brand:#7FD3DE;
  --comb:#F06B5B; --comb-deep:#A3302A; --comb-soft:#3A1D1A; --straw:#EDB94F; --straw-soft:#35290F; --ok:#6CC592;
  --on-selected:#0B1A1C;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
:lang(zh) body, html:lang(zh) body{font-family:"Noto Sans SC", var(--body);line-height:1.7}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
img,svg{max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{flex:none;width:38px;height:38px}
.brand .mark{flex:none;width:38px;height:38px;border-radius:10px;display:block}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.28rem;line-height:1.05;margin:0;letter-spacing:-.01em}
.brand h1 span{font-weight:500;color:var(--brand)}
.brand p{margin:2px 0 0;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:8px;flex:none}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:38px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-selected)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
section.view{display:none;padding-top:22px}
section.view.on{display:block}

/* Type */
h2.hero{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,6.4vw,2.7rem);line-height:1.02;letter-spacing:-.025em;margin:4px 0 10px;max-width:15ch}
html:lang(zh) h2.hero{letter-spacing:0;line-height:1.2}
.lede{color:var(--muted);margin:0 0 20px;max-width:56ch}
h3.sec{font-family:var(--display);font-weight:700;font-size:1.2rem;margin:28px 0 10px}

/* Symptom picker */
.groups{display:grid;gap:14px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px}
.group h4{margin:0 0 10px;font-size:.92rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.group h4 svg{width:18px;height:18px;color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 13px;font-size:.92rem;text-align:left;line-height:1.3;transition:background .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--brand);color:var(--btn-ink);font-weight:600}
.chip[aria-pressed="true"]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-right:7px;vertical-align:1px}

.results{margin-top:8px}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px}
.bar-row h3{margin:0}
.btn{border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:600;padding:11px 18px;min-height:44px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.red{background:var(--comb-deep);color:#fff}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-m);padding:18px;color:var(--muted);text-align:center}
.note{font-size:.86rem;color:var(--muted);margin:12px 2px 0}

.alarm{display:none;margin:18px 0 0;background:var(--comb-soft);border:1.5px solid var(--comb);border-radius:var(--r-m);padding:14px 16px;gap:12px;align-items:flex-start}
.alarm.on{display:flex}
.alarm svg{flex:none;width:26px;height:26px;color:var(--comb);margin-top:2px}
.alarm p{margin:0 0 10px;font-weight:600}

/* Disease rows */
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 14px 14px 16px;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.row.notify::before{background:var(--comb)}
.row .name{font-weight:600;font-size:1.02rem;line-height:1.3}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.red{background:var(--comb-soft);color:var(--comb);border-color:transparent}
.row .chev{width:20px;height:20px;color:var(--muted)}
.match{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.meter{flex:1;max-width:160px;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:6px}

.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:12px 0;width:100%;outline:none}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.filters .chip{white-space:nowrap}

/* Accordions */
details.sop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:10px}
details.sop summary{list-style:none;padding:15px 16px;font-weight:600;display:flex;align-items:center;gap:12px;cursor:pointer}
details.sop summary::-webkit-details-marker{display:none}
details.sop summary svg.ic{width:24px;height:24px;color:var(--brand);flex:none}
details.sop summary .plus{margin-left:auto;width:18px;height:18px;color:var(--muted);transition:transform .2s}
details.sop[open] summary .plus{transform:rotate(45deg)}
details.sop .body{padding:0 16px 16px}

ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-family:var(--display)}
ol.steps.red li::before{background:var(--comb-deep);color:#fff}
ul.dots{margin:0;padding-left:1.1em;display:grid;gap:6px}
ul.dots li::marker{color:var(--brand)}

/* Emergency */
.sos-hero{background:var(--comb-deep);color:#fff;border-radius:var(--r-l);padding:22px 20px 20px;margin-bottom:18px;position:relative;overflow:hidden}
.sos-hero h2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05;margin:0 0 8px;max-width:14ch}
html:lang(zh) .sos-hero h2{line-height:1.25}
.sos-hero p{margin:0;max-width:44ch;opacity:.95}
.sos-hero svg{position:absolute;right:-18px;bottom:-22px;width:130px;height:130px;opacity:.16}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 12px;font-family:var(--display);font-size:1.12rem}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:.86rem;font-weight:600;color:var(--muted)}
.field .in{display:flex;gap:8px}
.field input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px}
.field a.btn{display:inline-grid;place-items:center;text-decoration:none;min-width:84px}
.field a.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.readout{margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--sunk);font-weight:600}
.readout b{font-family:var(--display);font-size:1.5rem;margin-right:6px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
nav.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:9px 1px 10px;font-size:.68rem;line-height:1.2;text-align:center;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--brand)}
nav.tabs button[aria-selected="true"]::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
nav.tabs button.sos{color:var(--comb)}
nav.tabs button.sos[aria-selected="true"]::after{background:var(--comb)}

/* Ask AI */
#askOut{scroll-margin-top:84px}
.engine{cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);margin-bottom:14px}
.engine i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.engine.ok i{background:var(--ok)} .engine.warn i{background:var(--straw)}
.shot{border:2px dashed var(--line);border-radius:var(--r-l);background:var(--surface);padding:18px;display:grid;gap:12px;justify-items:center;text-align:center}
.shot.has{border-style:solid;padding:10px}
.shot img{width:100%;max-height:340px;object-fit:contain;border-radius:14px;background:var(--sunk)}
.shot .big{width:64px;height:64px;color:var(--brand)}
.shot .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.primary{background:var(--brand);color:var(--on-selected)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
textarea.q{width:100%;min-height:84px;resize:vertical;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font:inherit;color:inherit}
details.mini{margin:14px 0}
details.mini summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.mini summary::-webkit-details-marker{display:none}
details.mini .chips{margin-top:8px}
.chips.sm .chip{font-size:.84rem;padding:7px 11px}
.progress{display:none;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);margin-top:14px}
.progress.on{display:flex}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--sunk);border-top-color:var(--brand);flex:none}
@media (prefers-reduced-motion: no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.progress .grow{flex:1}
.err{display:none;margin-top:14px;padding:13px 15px;border-radius:var(--r-m);background:var(--comb-soft);border:1px solid var(--comb)}
.err.on{display:block}
.observed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;margin-top:18px}
.observed h4{margin:0 0 6px;font-size:.9rem;color:var(--muted)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-top:14px;overflow:hidden}
.rcard .rhead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.rank{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--muted);min-width:1.4ch}
.rcard .rname{font-weight:700;font-size:1.05rem;line-height:1.3;flex:1}
.lvl{font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.lvl.high{background:var(--comb-soft);color:var(--comb)}
.lvl.medium{background:var(--straw-soft);color:var(--straw)}
.lvl.low{background:var(--sunk);color:var(--muted)}
.rbody{display:grid;gap:14px;padding:14px 16px 16px}
.rbody h5{margin:0 0 6px;font-size:.86rem;color:var(--muted)}
.ref{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;background:var(--sunk);border-radius:14px;padding:10px}
.ref img{width:120px;height:96px;object-fit:cover;border-radius:10px}
.ref p{margin:0;font-size:.88rem}
.ref small{display:block;color:var(--muted);margin-top:4px;font-size:.76rem}
.answer{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:var(--r-m);padding:14px 16px;margin-top:14px;white-space:pre-wrap}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
select.sel{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font:inherit;color:inherit}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.msg{font-size:.86rem;margin:8px 0 0;min-height:1.2em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--comb)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.gallery button{border:0;padding:0;background:none;border-radius:10px;overflow:hidden;aspect-ratio:1}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.bigimg{width:100%;border-radius:14px;background:var(--sunk)}

/* Detail dialog */
dialog.sheet{border:0;padding:0;margin:0;max-width:none;max-height:none;width:100%;height:100%;background:var(--bg);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(5,15,17,.5)}
dialog.sheet.pop{width:min(460px,calc(100% - 32px));height:fit-content;max-height:calc(100% - 48px);margin:auto;border-radius:var(--r-l);border:1px solid var(--line)}
dialog.sheet.pop .sheet-head{padding-top:10px}
@media (min-width:760px){dialog.sheet:not(.pop){width:720px;height:calc(100% - 48px);margin:24px auto;border-radius:var(--r-l);border:1px solid var(--line)}}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.sheet-head .t{flex:1;font-weight:600;font-size:.95rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{padding:18px 18px calc(40px + env(safe-area-inset-bottom));overflow-y:auto}
.sheet-body h2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 10px}
html:lang(zh) .sheet-body h2{letter-spacing:0;line-height:1.25}
.facts{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin:16px 0 4px}
.facts div{display:grid;grid-template-columns:minmax(96px,32%) 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.facts div:first-child{border-top:0}
.facts dt{font-weight:600;color:var(--muted);font-size:.86rem}
.facts dd{margin:0}
.callout{border-radius:var(--r-m);padding:13px 15px;margin:12px 0;display:flex;gap:10px}
.callout svg{flex:none;width:22px;height:22px;margin-top:1px}
.callout.warn{background:var(--straw-soft);color:var(--ink)}
.callout.warn svg{color:var(--straw)}
.callout.red{background:var(--comb-soft)}
.callout.red svg{color:var(--comb)}
.callout p{margin:0}
.src{margin-top:24px;font-size:.8rem;color:var(--muted)}

footer.foot{font-size:.8rem;color:var(--muted);padding:26px 0 10px;border-top:1px solid var(--line);margin-top:30px}

@media (prefers-reduced-motion: no-preference){
  dialog.sheet[open]{animation:rise .24s ease-out}
  @keyframes rise{from{transform:translateY(24px);opacity:.3}to{transform:none;opacity:1}}
}
@media (max-width:380px){
  .brand p{display:none}
  .seg button{padding:6px 8px;min-width:32px}
}
</style>
</head>
<body>

<header class="top">

<main class="wrap">
  <!-- CHECK -->
  <section class="view on" id="v-check" aria-labelledby="h-check">
    <h2 class="hero" id="h-check" data-t="checkHero"></h2>
    <p class="lede" data-t="checkLede"></p>
    <div class="groups" id="groups"></div>
    <div class="alarm" id="alarm" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>
      <div><p data-t="alarmText"></p><button class="btn red" data-go="sos" data-t="alarmBtn"></button></div>
    </div>
    <div class="bar-row">
      <h3 class="sec" data-t="results"></h3>
      <button class="btn ghost" id="clearBtn" data-t="clear"></button>
    </div>
    <div class="results list" id="results"></div>
    <p class="note" data-t="disclaimer"></p>
  </section>

  <!-- ASK AI -->
  <section class="view" id="v-ask" aria-labelledby="h-ask">
    <h2 class="hero" id="h-ask" data-t="askHero"></h2>
    <p class="lede" data-t="askLede"></p>
    <div class="engine" id="engine" role="button" tabindex="0"><i></i><span></span></div>

    <div class="shot" id="shot">
      <div id="shotEmpty" style="display:grid;gap:12px;justify-items:center">
        <svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <p style="margin:0;color:var(--muted)" data-t="shotHint"></p>
        <p id="shotPrivacy" style="margin:0;color:var(--muted);font-size:.76rem;display:none" data-t="shotPrivacy"></p>
      </div>
      <img id="shotImg" alt="" hidden>
      <div class="row2">
        <button class="btn primary" id="camBtn" data-t="takePhoto"></button>
        <button class="btn ghost" id="galBtn" data-t="pickPhoto"></button>
        <button class="btn ghost" id="rmBtn" data-t="removePhoto" hidden></button>
      </div>
      <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
      <input type="file" id="galIn" accept="image/*" hidden>
    </div>

    <details class="mini" id="askSigns">
      <summary><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="addSigns"></span> <span class="pill" id="signCount">0</span></summary>
      <div class="chips sm" id="askChips"></div>
    </details>

    <label for="askQ" class="sr" style="display:block;font-weight:600;margin:6px 0 8px" data-t="qLabel"></label>
    <textarea class="q" id="askQ"></textarea>

    <div class="btnrow" style="margin-top:14px">
      <button class="btn primary block" id="askBtn" data-t="askBtn"></button>
    </div>
    <div class="progress" id="prog" role="status"><div class="spin"></div><div class="grow" id="progT"></div><button class="btn ghost" id="stopBtn" data-t="stop"></button></div>
    <div class="err" id="askErr" role="alert"></div>
    <div id="askOut" aria-live="polite"></div>

    <details class="sop" id="setBox" style="margin-top:26px">
      <summary><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg><span data-t="setTitle"></span><svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></summary>
      <div class="body">
        <div class="field">
          <label for="provSel" data-t="provLabel"></label>
          <select class="sel" id="provSel">
            <option value="anthropic">Claude (Anthropic)</option>
            <option value="openai">ChatGPT (OpenAI)</option>
          </select>
        </div>
        <div class="field">
          <label for="keyIn" data-t="keyLabel"></label>
          <div class="keyrow">
            <input id="keyIn" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
            <button class="btn ghost" id="eyeBtn" data-t="show"></button>
          </div>
        </div>
        <div class="field">
          <label for="modelSel" data-t="modelLabel"></label>
          <select class="sel" id="modelSel"></select>
          <input id="customModel" class="sel" style="margin-top:8px;font-family:ui-monospace,Menlo,monospace" hidden autocomplete="off" spellcheck="false">
        </div>
        <div class="btnrow">
          <button class="btn primary" id="saveKey" data-t="saveKey"></button>
          <button class="btn" id="testKey" data-t="testKey"></button>
          <button class="btn ghost" id="delKey" data-t="delKey"></button>
        </div>
        <p class="msg" id="keyMsg" aria-live="polite"></p>
        <p class="note" data-t="keyNote"></p>
      </div>
    </details>

    <details class="sop" style="margin-top:10px">
      <summary><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span data-t="libTitle"></span><svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></summary>
      <div class="body"><p class="note" style="margin-top:0" id="libNote"></p><div class="gallery" id="gallery"></div></div>
    </details>
  </section>

  <!-- DISEASES -->
  <section class="view" id="v-dis" aria-labelledby="h-dis">
    <h2 class="hero" id="h-dis" data-t="disHero"></h2>
    <p class="lede" data-t="disLede"></p>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off">
      </label>
      <div class="filters" id="filters" role="group"></div>
    </div>
    <div class="list" id="dlist"></div>
  </section>

  <!-- BIOSECURITY -->
  <section class="view" id="v-bio" aria-labelledby="h-bio">
    <h2 class="hero" id="h-bio" data-t="bioHero"></h2>
    <p class="lede" data-t="bioLede"></p>
    <div id="sops"></div>
  </section>

  <!-- EMERGENCY -->
  <section class="view" id="v-sos" aria-labelledby="h-sos">
    <div class="sos-hero">
      <h2 id="h-sos" data-t="sosHero"></h2>
      <p data-t="sosLede"></p>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>
    </div>
    <div class="panel">
      <ol class="steps red" id="sosSteps"></ol>
    </div>
    <div class="panel">
      <h3 data-t="mortTitle"></h3>
      <div class="grid2">
        <div class="field"><label for="mBirds" data-t="mBirds"></label><div class="in"><input id="mBirds" type="number" inputmode="numeric" min="0"></div></div>
        <div class="field"><label for="mDead" data-t="mDead"></label><div class="in"><input id="mDead" type="number" inputmode="numeric" min="0"></div></div>
      </div>
      <div class="readout" id="mOut" aria-live="polite">–</div>
      <p class="note" data-t="mHint"></p>

  spread:T("Very contagious through air, droppings, people and equipment. It can cover large areas quickly.","Sangat mudah berjangkit melalui udara, najis, orang dan peralatan. Ia boleh merebak ke kawasan luas dengan cepat.","传染性极强，经空气、粪便、人员和器具传播，可迅速扩散到大范围。"),
  signs:[
    T("Coughing, sneezing, rattling breath","Batuk, bersin, bunyi nafas berdehit","咳嗽、打喷嚏、呼吸有啰音"),
    T("Broilers: uneven growth and worse FCR","Pedaging: pertumbuhan tidak seragam dan FCR lebih teruk","肉鸡：生长不均、料肉比变差"),
    T("Egg drop of 5–70%; thin, rough, pale or misshapen eggs; watery whites","Telur menurun 5–70%; kulit nipis, kasar, pucat atau cacat; putih telur cair","产蛋下降 5–70%；蛋壳薄、粗、褪色或畸形；蛋白稀"),
    T("Some strains harm kidneys: wet litter and more deaths","Sesetengah strain merosakkan buah pinggang: sekam basah dan kematian bertambah","部分毒株损害肾脏：垫料潮湿、死亡增加"),
    T("Early infection in pullets can cause false layers later","Jangkitan awal pada ayam dara boleh menyebabkan penelur palsu kemudian","雏鸡早期感染，日后可能成为假产蛋鸡")
  ],
  warn:T("These signs are not unique to IB. A lab test (PCR) shows which strain is present, which guides vaccine choice.","Tanda ini tidak khusus untuk IB. Ujian makmal (PCR) menunjukkan strain yang ada, sebagai panduan memilih vaksin.","这些症状并非 IB 独有。化验（PCR）可确认毒株，作为选择疫苗的依据。"),
  treat:T("No cure. The vet may treat secondary bacterial infection. Keep birds warm and cut dust and ammonia.","Tiada ubat. Doktor haiwan mungkin merawat jangkitan bakteria sekunder. Pastikan ayam hangat dan kurangkan habuk serta ammonia.","无特效药。兽医可能处理继发细菌感染。注意保温，减少粉尘和氨气。"),
  prevent:[
    T("Vaccinate by spray in the hatchery, with strains that match local variants.","Vaksin secara semburan di penetasan dengan strain yang sepadan dengan varian tempatan.","在孵化场喷雾免疫，选用与本地变异株相符的疫苗株。"),
    T("Layers and breeders: live boosters during rearing, then an inactivated vaccine before lay.","Penelur dan baka: dos penggalak hidup semasa membesar, kemudian vaksin tak aktif sebelum bertelur.","蛋鸡和种鸡：育成期用活苗加强，开产前再打灭活苗。"),
    T("Monitor with PCR and serology to know which variants are around.","Pantau dengan PCR dan serologi untuk mengetahui varian yang beredar.","用 PCR 和血清学监测本地流行株。"),
    T("Strict biosecurity between houses and between farms.","Biosekuriti ketat antara reban dan antara ladang.","鸡舍之间、鸡场之间严格执行生物安全。")
  ]},
{ id:"ibd", type:"virus", flow:"std", src:SRC.gen,
  tags:["dull","white","wet","sudden","many","growth","eat"],
  name:T("Gumboro (infectious bursal disease, IBD)","Gumboro (penyakit bursa berjangkit, IBD)","法氏囊病（甘保罗病，IBD）"),
  cause:T("Birnavirus (IBDV). It survives a long time in houses.","Birnavirus (IBDV). Ia boleh hidup lama dalam reban.","双 RNA 病毒 (IBDV)，可在鸡舍中长期存活。"),
  affects:T("Young chickens, mostly 3–6 weeks old. It damages the immune system.","Anak ayam, kebanyakannya umur 3–6 minggu. Ia merosakkan sistem imun.","幼鸡，多见于 3–6 周龄。会破坏免疫系统。"),
  spread:T("Droppings, litter, equipment and people. The virus stays in houses for months.","Najis, sekam, peralatan dan orang. Virus kekal dalam reban berbulan-bulan.","粪便、垫料、器具和人员。病毒可在鸡舍存留数月。"),
  signs:[
    T("Sudden start; dull, fluffed birds","Bermula tiba-tiba; ayam lesu, bulu kembang","突然发病；精神差、羽毛蓬松"),
    T("Watery white diarrhoea; birds peck at their own vent","Cirit-birit putih berair; ayam mematuk dubur sendiri","白色水样腹泻；啄自己的肛门"),
    T("Deaths rise for about a week, then fall","Kematian meningkat kira-kira seminggu, kemudian menurun","死亡增加约一周后下降"),
    T("Later: poor vaccine response and more other diseases","Kemudian: tindak balas vaksin lemah dan lebih banyak penyakit lain","之后：疫苗效果差，其他疾病增多")
  ],
  treat:T("No cure. Give clean water and electrolytes on vet advice. The vet handles any secondary infection.","Tiada ubat. Beri air bersih dan elektrolit atas nasihat doktor haiwan. Doktor haiwan urus jangkitan sekunder.","无特效药。按兽医建议提供干净饮水和电解质。继发感染由兽医处理。"),
  prevent:[
    T("Vaccinate on a vet program, timed to the chicks' maternal antibody level.","Vaksin mengikut program doktor haiwan, ikut paras antibodi induk anak ayam.","按兽医程序免疫，时间根据雏鸡母源抗体水平而定。"),
    T("Vaccinate breeders so chicks start with maternal antibodies.","Vaksin ayam baka supaya anak ayam bermula dengan antibodi induk.","种鸡要免疫，让雏鸡带有母源抗体。"),
    T("Thorough clean-out and disinfection between flocks.","Pembersihan dan nyahkuman menyeluruh antara kawanan.","每批之间彻底清洁消毒。")
  ]},
{ id:"salm", type:"bact", flow:"std", src:SRC.hb,
  tags:["white","dull","sudden","lame","drop","eat","growth"],
  name:T("Salmonellosis (pullorum, fowl typhoid, paratyphoid)","Salmonelosis (pullorum, tifoid ayam, paratifoid)","沙门氏菌病（鸡白痢、禽伤寒、副伤寒）"),
  cause:T("Salmonella bacteria.","Bakteria Salmonella.","沙门氏菌。"),
  affects:T("Chicks (pullorum), growing and adult birds (fowl typhoid). Paratyphoid types are a food safety risk to people.","Anak ayam (pullorum), ayam membesar dan dewasa (tifoid ayam). Jenis paratifoid berisiko kepada keselamatan makanan manusia.","雏鸡（白痢）、青年和成年鸡（禽伤寒）。副伤寒型对人有食品安全风险。"),
  spread:T("From infected breeders through the egg, and via the hatchery, feed, rodents and droppings.","Dari induk dijangkiti melalui telur, dan melalui penetasan, makanan, tikus dan najis.","带菌种鸡经种蛋传给雏鸡，也可经孵化场、饲料、老鼠和粪便传播。"),
  signs:[
    T("Chicks: white pasty vent, huddling, deaths in the first 2–3 weeks","Anak ayam: dubur putih melekat, berkumpul, mati dalam 2–3 minggu pertama","雏鸡：肛门糊白粪、扎堆，头 2–3 周死亡"),
    T("Adults: pale comb, dullness, green-yellow diarrhoea, egg drop","Dewasa: balung pucat, lesu, cirit-birit hijau kekuningan, telur menurun","成年鸡：鸡冠苍白、精神差、黄绿色腹泻、产蛋下降"),
    T("Swollen joints","Sendi bengkak","关节肿大"),
    T("Carrier birds can look healthy","Ayam pembawa boleh nampak sihat","带菌鸡可能外表健康")
  ],
  treat:T("Vet-prescribed antibiotics can cut deaths but do not clear carriers. Breeder flocks are usually tested and positive birds removed.","Antibiotik preskripsi doktor haiwan boleh kurangkan kematian tetapi tidak menghapuskan pembawa. Kawanan baka biasanya diuji dan ayam positif disingkirkan.","兽医处方抗生素可减少死亡，但清除不了带菌鸡。种鸡群通常检测后淘汰阳性鸡。"),
  prevent:[
    T("Buy chicks only from Salmonella-tested breeder flocks.","Beli anak ayam hanya dari kawanan baka yang diuji Salmonella.","只从经沙门氏菌检测的种鸡场购雏。"),
    T("Control rodents and keep feed clean.","Kawal tikus dan pastikan makanan bersih.","灭鼠，保持饲料清洁。"),
    T("Hatchery egg hygiene, and vaccination where the vet advises.","Kebersihan telur di penetasan, dan vaksinasi jika dinasihatkan doktor haiwan.","孵化场做好种蛋卫生，按兽医建议免疫。")
  ]},
{ id:"campy", type:"bact", flow:"std", src:SRC.hb,
  tags:[],
  name:T("Campylobacteriosis","Kampilobakteriosis","弯曲杆菌病"),
  cause:T("Campylobacter jejuni and related bacteria.","Campylobacter jejuni dan bakteria berkaitan.","空肠弯曲杆菌等。"),
  affects:T("Chickens carry it in the gut, usually without illness. It is a major cause of food poisoning in people.","Ayam membawanya dalam usus, biasanya tanpa sakit. Ia punca utama keracunan makanan pada manusia.","鸡肠道带菌，通常不发病，但它是人类食物中毒的主要原因之一。"),
  spread:T("Water, flies, rodents, workers' boots, and partial catching (thinning) of flocks.","Air, lalat, tikus, but pekerja, dan penangkapan separa kawanan.","饮水、苍蝇、老鼠、工人鞋靴，以及分批抓鸡出栏。"),
  signs:[
    T("Usually no signs in the flock","Biasanya tiada tanda pada kawanan","鸡群通常没有症状"),
    T("Found by testing droppings or carcasses","Dikesan melalui ujian najis atau karkas","靠粪便或胴体检测发现")
  ],
  warn:T("The main goal is to keep it out of the food chain.","Matlamat utama ialah menghalangnya daripada masuk rantaian makanan.","主要目标是不让它进入食物链。"),
  treat:T("Flock treatment is not the answer. Focus on hygiene.","Rawatan kawanan bukan jalan penyelesaian. Fokus pada kebersihan.","对鸡群用药不是办法，重点在卫生。"),
  prevent:[
    T("Boot dips and house-only boots","Celup but dan but khas setiap reban","消毒脚踏池，每栋鸡舍专用雨靴"),
    T("Clean, treated drinking water","Air minum bersih yang dirawat","干净、经处理的饮水"),
    T("Fly and rodent control","Kawalan lalat dan tikus","控制苍蝇和老鼠"),
    T("Avoid thinning where possible","Elakkan tangkapan separa jika boleh","尽量避免分批抓鸡")
  ]},
{ id:"fc", type:"bact", flow:"std", src:SRC.hb,
  tags:["sudden","many","comb","face","green","lame","resp","dull","eat"],
  name:T("Fowl cholera","Kolera ayam","禽霍乱"),
  cause:T("Pasteurella multocida bacteria.","Bakteria Pasteurella multocida.","多杀性巴氏杆菌。"),
  affects:T("Growing and adult birds. It is not a hatchery disease; infection starts on the farm.","Ayam membesar dan dewasa. Ia bukan penyakit penetasan; jangkitan bermula di ladang.","青年和成年鸡。不是孵化场带来的病，感染发生在鸡场。"),
  spread:T("Carrier birds, wild birds, rodents, pigs, cats and dogs, and dirty water.","Ayam pembawa, burung liar, tikus, babi, kucing dan anjing, dan air tercemar.","带菌鸡、野鸟、老鼠、猪、猫、狗，以及被污染的水。"),
  signs:[
    T("Sudden deaths, often of birds in good condition","Kematian mengejut, selalunya ayam dalam keadaan baik","突然死亡，常是体况良好的鸡"),
    T("Dark comb, swollen wattles","Balung gelap, pial bengkak","鸡冠发紫、肉髯肿胀"),
    T("Green diarrhoea, fever, not eating","Cirit-birit hijau, demam, tidak makan","绿色腹泻、发热、不吃料"),
    T("Chronic form: swollen joints, face or wattles","Bentuk kronik: sendi, muka atau pial bengkak","慢性型：关节、脸部或肉髯肿胀")
  ],
  treat:T("Vet-prescribed antibiotics chosen from a lab sensitivity test. Outbreaks can return after treatment stops, so remove the source too.","Antibiotik preskripsi doktor haiwan berdasarkan ujian sensitiviti makmal. Wabak boleh berulang selepas rawatan berhenti, jadi hapuskan puncanya juga.","兽医按药敏试验结果开抗生素。停药后可能复发，所以也要清除传染源。"),
  prevent:[
    T("Keep age groups apart; run all-in all-out.","Asingkan kumpulan umur; amalkan masuk semua keluar semua.","不同日龄分开饲养，实行全进全出。"),
    T("No pigs, dogs or cats on the farm; keep wild birds out.","Tiada babi, anjing atau kucing di ladang; halang burung liar.","场内不养猪、狗、猫，防止野鸟进入。"),
    T("Use a safe, controlled water source.","Guna sumber air yang selamat dan terkawal.","使用安全、受控的水源。"),
    T("Where it is common, vaccinate (usually inactivated bacterins).","Di kawasan yang kerap berlaku, vaksin (biasanya bakterin tak aktif).","常发地区要免疫（通常用灭活菌苗）。")
  ]},
{ id:"ne", type:"bact", flow:"std", src:SRC.hb,
  tags:["sudden","blood","dull","eat","wet","growth"],
  name:T("Necrotic enteritis (clostridiosis)","Enteritis nekrotik (klostridiosis)","坏死性肠炎（梭菌病）"),
  cause:T("Clostridium perfringens bacteria.","Bakteria Clostridium perfringens.","产气荚膜梭菌。"),
  affects:T("Mostly broilers, 2–6 weeks old.","Kebanyakannya ayam pedaging, umur 2–6 minggu.","多见于 2–6 周龄肉鸡。"),
  spread:T("Normal gut bacteria that overgrow when coccidiosis, feed changes or wet litter damage the gut.","Bakteria usus biasa yang membiak berlebihan apabila koksidiosis, pertukaran makanan atau sekam basah merosakkan usus.","肠道常在菌，在球虫病、换料或垫料潮湿损伤肠道时大量繁殖。"),
  signs:[
    T("Sudden rise in deaths","Kematian naik mendadak","死亡突然增加"),
    T("Dark, smelly or bloody droppings","Najis gelap, berbau atau berdarah","发黑、恶臭或带血的粪便"),
    T("Dull, ruffled, not eating","Lesu, bulu kusut, tidak makan","精神差、羽毛乱、不吃料"),
    T("Mild form: wet litter and poor growth","Bentuk ringan: sekam basah dan pertumbuhan lambat","轻型：垫料潮湿、生长慢")
  ],
  treat:T("Water-soluble antibiotics on vet prescription. Keep to the withdrawal period before slaughter.","Antibiotik larut air dengan preskripsi doktor haiwan. Patuhi tempoh henti ubat sebelum sembelih.","按兽医处方饮水给药。屠宰前遵守停药期。"),
  prevent:[
    T("Control coccidiosis.","Kawal koksidiosis.","控制球虫病。"),
    T("Keep litter dry; fix leaking drinkers.","Pastikan sekam kering; baiki bekas minum yang bocor.","保持垫料干燥，修好漏水的饮水器。"),
    T("Change feed step by step; use good-quality feed.","Tukar makanan secara beransur; guna makanan berkualiti.","逐步换料，使用优质饲料。")
  ]},
{ id:"cocci", type:"para", flow:"std", src:SRC.hb,
  tags:["blood","dull","growth","eat","wet"],
  name:T("Coccidiosis","Koksidiosis","球虫病"),
  cause:T("Eimeria parasites in the gut.","Parasit Eimeria dalam usus.","肠道内的艾美耳球虫。"),
  affects:T("Mostly young birds on litter, around 3–6 weeks old.","Kebanyakannya ayam muda atas sekam, sekitar umur 3–6 minggu.","多见于垫料饲养的 3–6 周龄幼鸡。"),
  spread:T("Parasite eggs (oocysts) in droppings and wet litter.","Telur parasit (oosista) dalam najis dan sekam basah.","粪便和潮湿垫料中的卵囊。"),
  signs:[
    T("Bloody or watery droppings","Najis berdarah atau berair","带血或水样粪便"),
    T("Dull, pale, fluffed birds","Ayam lesu, pucat, bulu kembang","精神差、苍白、羽毛蓬松"),
    T("Poor growth, low feed intake","Pertumbuhan lambat, kurang makan","生长慢、采食减少"),
    T("Often opens the door to necrotic enteritis","Selalunya membuka jalan kepada enteritis nekrotik","常继发坏死性肠炎")
  ],
  treat:T("Anticoccidial drugs in water, on vet prescription. Sulfonamides must not be used in laying hens. Vitamins A and K help recovery.","Ubat antikoksidia dalam air, dengan preskripsi doktor haiwan. Sulfonamida tidak boleh digunakan pada ayam penelur. Vitamin A dan K membantu pemulihan.","按兽医处方饮水给抗球虫药。磺胺类药不可用于产蛋鸡。维生素 A 和 K 有助恢复。"),
  prevent:[
    T("Anticoccidials in feed, rotated to slow resistance, or vaccination.","Antikoksidia dalam makanan, digilir untuk melambatkan kerintangan, atau vaksinasi.","饲料中加抗球虫药并轮换使用以减缓耐药，或接种球虫疫苗。"),
    T("Keep litter dry.","Pastikan sekam kering.","保持垫料干燥。"),
    T("Avoid feed program mistakes, such as wrong dose or stopping too early.","Elakkan kesilapan program makanan, seperti dos salah atau berhenti terlalu awal.","避免饲料程序出错，例如剂量不对或过早停药。")
  ]},
{ id:"mg", type:"bact", flow:"std", src:SRC.hb,

  spread:T("Through the egg from infected breeders, and bird to bird through the air.","Melalui telur dari induk dijangkiti, dan dari ayam ke ayam melalui udara.","经带菌种鸡的种蛋传播，鸡与鸡之间经空气传播。"),
  signs:[
    T("Rattling breath, coughing, nasal discharge","Bunyi nafas berdehit, batuk, lelehan hidung","呼吸啰音、咳嗽、流鼻涕"),
    T("Foamy eyes; swollen sinuses (mainly turkeys)","Mata berbuih; sinus bengkak (terutamanya ayam belanda)","眼有泡沫；鼻窦肿胀（火鸡较明显）"),
    T("Slow growth; air sac lesions at slaughter","Pertumbuhan lambat; lesi kantung udara semasa sembelih","生长慢；屠宰时见气囊炎"),
    T("Egg drop in layers","Telur menurun pada ayam penelur","蛋鸡产蛋下降")
  ],
  treat:T("Vet-prescribed antimycoplasma drugs reduce signs but do not remove the infection.","Ubat antimikoplasma preskripsi doktor haiwan mengurangkan tanda tetapi tidak menghapuskan jangkitan.","兽医处方抗支原体药可减轻症状，但不能根除感染。"),
  prevent:[
    T("Buy chicks from MG-free breeders.","Beli anak ayam dari induk bebas MG.","从无 MG 的种鸡场购雏。"),
    T("Single-age farms; all-in all-out.","Ladang satu umur; masuk semua keluar semua.","单一日龄饲养，全进全出。"),
    T("Vaccines (inactivated or live) where allowed and advised by the vet.","Vaksin (tak aktif atau hidup) jika dibenarkan dan dinasihatkan doktor haiwan.","在法规允许并经兽医建议下使用疫苗（灭活或活苗）。"),
    T("Good ventilation and low ammonia.","Pengudaraan baik dan ammonia rendah.","通风良好，氨气浓度低。")
  ]},

/* ---------- state ---------- */
const picked = new Set();
let filter = "all";

/* ---------- render ---------- */
const $ = s => document.querySelector(s);
const typeName = t => L({virus:UI.fVirus, bact:UI.fBact, para:UI.fPara}[t]);

function applyStatic(){
  const vt = document.getElementById("verTag"); if (vt) vt.textContent = "v" + APP_VERSION;
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = L(UI[el.dataset.t]); });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#q").placeholder = L(UI.search);
  $("#themeBtn").setAttribute("aria-label", L(UI.theme));
  $("#closeSheet").setAttribute("aria-label", L(UI.close));
}

function renderGroups(){
  $("#groups").innerHTML = GROUPS.map(g => `
    <div class="group" role="group" aria-label="${esc(L(g.name))}">
      <h4><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${g.icon}</svg>${esc(L(g.name))}</h4>
      <div class="chips">${SYM.filter(s => s[1] === g.id).map(s =>
        `<button class="chip" data-sym="${s[0]}" aria-pressed="${picked.has(s[0])}">${esc(L(s[2]))}</button>`).join("")}
      </div>
    </div>`).join("");
}

function rowHTML(d, extra=""){
  return `<button class="row${d.notify ? " notify" : ""}" data-open="${d.id}">
    <div>
      <div class="name">${esc(L(d.name))}</div>
      <div class="meta"><span class="pill">${esc(typeName(d.type))}</span>${d.notify ? `<span class="pill red">${esc(L(UI.report))}</span>` : ""}</div>
      ${extra}
    </div>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>`;
}

function renderResults(){
  const box = $("#results");
  $("#alarm").classList.toggle("on", picked.has("many") || (picked.has("sudden") && (picked.has("comb") || picked.has("nerv"))));
  if (!picked.size){ box.innerHTML = `<div class="empty">${esc(L(UI.pick))}</div>`; return; }
  const scored = D.filter(d => d.tags.length).map(d => {
    const hit = d.tags.filter(t => picked.has(t)).length;
    const score = hit ? (hit / picked.size) * .7 + (hit / d.tags.length) * .3 : 0;
    return {d, hit, score};
  }).filter(x => x.hit).sort((a,b) => b.score - a.score || (b.d.notify - a.d.notify)).slice(0, 6);
  if (!scored.length){ box.innerHTML = `<div class="empty">${esc(L(UI.noMatch))}</div>`; return; }
  box.innerHTML = scored.map(({d, hit, score}) => rowHTML(d,
    `<div class="match"><span class="meter"><i style="width:${Math.round(score*100)}%"></i></span>${esc(L(UI.matchOf).replace("{n}", hit).replace("{m}", picked.size))}</div>`
  )).join("");
}

function renderFilters(){
  const fs = [["all",UI.fAll],["virus",UI.fVirus],["bact",UI.fBact],["para",UI.fPara],["report",UI.fReport]];
  $("#filters").innerHTML = fs.map(([k,n]) => `<button class="chip" data-filter="${k}" aria-pressed="${filter===k}">${esc(L(n))}</button>`).join("");
}

function renderList(){
  const q = $("#q").value.trim().toLowerCase();
  const list = D.filter(d => {
    if (filter === "report" && !d.notify) return false;
    if (!["all","report"].includes(filter) && d.type !== filter) return false;
    if (!q) return true;
    return [d.name.en, d.name.ms, d.name.zh, d.cause.en].join(" ").toLowerCase().includes(q);
  });
  $("#dlist").innerHTML = list.length ? list.map(d => rowHTML(d)).join("") : `<div class="empty">${esc(L(UI.none))}</div>`;
}

const plusIcon = '<svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
function renderSops(){
  const open = new Set([...document.querySelectorAll("details.sop[open]")].map(d => d.dataset.id));
  $("#sops").innerHTML = SOPS.map(s => `
    <details class="sop" data-id="${s.id}"${open.has(s.id) ? " open" : ""}>
      <summary><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg>${esc(L(s.title))}${plusIcon}</summary>
      <div class="body">${s.ordered
        ? `<ol class="steps">${s.items.map(i => `<li>${esc(L(i))}</li>`).join("")}</ol>`
        : `<ul class="dots">${s.items.map(i => `<li>${esc(L(i))}</li>`).join("")}</ul>`}</div>
    </details>`).join("");
}

function renderSos(){
  $("#sosSteps").innerHTML = FLOW.emerg.map(i => `<li>${esc(L(i))}</li>`).join("");
  const c = [["vet",UI.cVet],["dvs",UI.cDvs],["mgr",UI.cMgr]];
  $("#contactFields").innerHTML = c.map(([k,n]) => {
    const v = store.get("c:"+k) || "";
    return `<div class="field"><label for="c-${k}">${esc(L(n))}</label>
      <div class="in"><input id="c-${k}" data-contact="${k}" type="tel" inputmode="tel" placeholder="${esc(L(UI.phone))}" value="${esc(v)}">
      <a class="btn" id="call-${k}" href="${v ? "tel:"+esc(v.replace(/[^\d+]/g,"")) : "#"}" aria-disabled="${!v}">${esc(L(UI.call))}</a></div></div>`;
  }).join("");
  calcMort();
}

function calcMort(){
  const b = parseFloat($("#mBirds").value), d = parseFloat($("#mDead").value);
  const out = $("#mOut");
  if (b > 0 && d >= 0){
    const p = (d / b) * 100;
    out.innerHTML = lang === "zh"
      ? `${esc(L(UI.mRes))} <b>${p.toFixed(2)}%</b>`
      : `<b>${p.toFixed(2)}%</b>${esc(L(UI.mRes))}`;
  } else out.textContent = "–";
}

function openDisease(id){
  const d = D.find(x => x.id === id); if (!d) return;
  const facts = [["cause",d.cause],["affects",d.affects],["spread",d.spread]]
    .map(([k,v]) => `<div><dt>${esc(L(UI[k]))}</dt><dd>${esc(L(v))}</dd></div>`).join("");
  const warnIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>';
  const infoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>';
  $("#dHeadT").textContent = L(d.name);

async function exportPDF(){
  if (!lastResult) return;
  const btn = $("#pdfBtn"), errEl = $("#pdfErr");
  if (errEl) errEl.style.display = "none";
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = L(UI.pdfWorking);
  let host;
  try {
    await ensurePdfLibs();
    if (document.fonts?.ready) await document.fonts.ready;

    host = buildExportNode();
    document.body.appendChild(host);
    const target = host.firstElementChild;

    const canvas = await html2canvas(target, { scale: 2, backgroundColor: "#EDF3F2", useCORS: true });
    const { jsPDF } = window.jspdf;
    const pageW = 595.28, pageH = 841.89;   // A4 in pt
    const imgW = pageW, imgH = canvas.height * (imgW / canvas.width);
    const pdf = new jsPDF({ unit: "pt", format: "a4" });
    const imgData = canvas.toDataURL("image/jpeg", 0.92);
    let heightLeft = imgH, position = 0;
    pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
    heightLeft -= pageH;
    while (heightLeft > 0){
      position -= pageH;
      pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
      heightLeft -= pageH;
    }

    const filename = `poultry-sop-report-${new Date().toISOString().slice(0,10)}.pdf`;
    const blob = pdf.output("blob");
    let shared = false;
    if (navigator.canShare){
      try {
        const file = new File([blob], filename, { type: "application/pdf" });
        if (navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file], title: "Poultry SOP" });
          shared = true;
        }
      } catch(shareErr){
        if (shareErr?.name === "AbortError") shared = true;   // user cancelled the share sheet — not an error
      }
    }
    if (!shared) pdf.save(filename);
  } catch(e){
    if (errEl){ errEl.textContent = L(UI.pdfFail); errEl.style.display = "block"; }
  } finally {
    if (host?.parentNode) host.parentNode.removeChild(host);
    btn.disabled = false; btn.textContent = original;
  }
}

function dataUriParts(u){ const m = /^data:([^;]+);base64,(.*)$/.exec(u); return {type:m[1], data:m[2]}; }
function b64ToBlob(b64, type){ const bin = atob(b64); const a = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type}); }
function parseJSON(text){
  const t = String(text).replace(/```json|```/g,"").trim();
  try { return JSON.parse(t); } catch(e){}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b+1));
  throw {code:"invalid_json"};
}

class AskError { constructor(kind){ this.kind = kind; } }

// images: [{type, data(base64)}]
async function callOpenAI(key, prompt, images, signal, maxTokens){
  let res;
  try {
    res = await fetch("https://api.openai.com/v1/responses", {
      method:"POST", signal,
      headers:{"content-type":"application/json", "authorization":"Bearer " + key},
      body: JSON.stringify({
        model: getModel(),
        max_output_tokens: Math.max(maxTokens, 800) * 3,   // leaves room for reasoning tokens
        input:[{role:"user", content:[
          ...images.map(im => ({type:"input_image", image_url:`data:${im.type};base64,${im.data}`})),
          {type:"input_text", text: prompt}
        ]}]
      })
    });
  } catch(e){
    if (e.name === "AbortError") throw new AskError("cancel");
    throw new AskError("net");
  }
  checkStatus(res);
  const data = await res.json();
  const text = data.output_text || (data.output || []).flatMap(o => o.content || []).map(c => c.text || "").join("\n");
  try { return parseJSON(text); } catch(e){ throw new AskError("gen"); }
}
function checkStatus(res){
  if (res.status === 401 || res.status === 403) throw new AskError("401");
  if (res.status === 404) throw new AskError("404");
  if (res.status === 429 || res.status === 529) throw new AskError("429");
  if (!res.ok) throw new AskError("gen");
}

async function callClaude(prompt, images, signal, maxTokens=1600){
  const key = getKey();
  if (key && getProv() === "openai"){
    try { return await callOpenAI(key, prompt, images, signal, maxTokens); }
    catch(e){ if (e.kind === "net" && sampleFn && sampleImgMax) return callSample(prompt, images, signal); throw e; }
  }
  if (key){
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", signal,
        headers:{
          "content-type":"application/json",
          "x-api-key": key,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body: JSON.stringify({
          model: getModel(), max_tokens: maxTokens,
          messages:[{role:"user", content:[
            ...images.map(im => ({type:"image", source:{type:"base64", media_type:im.type, data:im.data}})),
            {type:"text", text: prompt}
          ]}]
        })
      });
    } catch(e){
      if (e.name === "AbortError") throw new AskError("cancel");
      if (sampleFn && sampleImgMax) return callSample(prompt, images, signal);   // blocked inside claude.ai
      throw new AskError("net");
    }
    checkStatus(res);
    const data = await res.json();
    const text = (data.content || []).map(c => c.type === "text" ? c.text : "").join("\n");
    try { return parseJSON(text); } catch(e){ throw new AskError("gen"); }
  }
  if (sampleFn) return callSample(prompt, images, signal);
  throw new AskError("none");
}
async function callSample(prompt, images, signal){
  const blobs = images.slice(0, sampleImgMax || 1).map(im => b64ToBlob(im.data, im.type));
  try {
    return await sampleFn.json(prompt, {images: blobs, signal, cache:false});
  } catch(e){
    if (e.code === "cancelled") throw new AskError("cancel");
    if (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "images_unavailable") throw new AskError("denied");
    if (e.code === "rate_limited") throw new AskError("429");
    throw new AskError("gen");
  }
}

/* ---------- Ask AI: retrieval ---------- */
const STOP = new Set("the a an and or of in on with to is are was be at by for from this that bird birds chicken chickens hen hens".split(" "));
const words = t => String(t).toLowerCase().match(/[a-z]{3,}/g)?.filter(w => !STOP.has(w)) || [];
function overlap(a, bSet){ let n=0; for (const w of new Set(a)) if (bSet.has(w)) n++; return n; }
function diseaseText(d){
  return [d.name.en, d.cause.en, d.affects.en, d.spread.en, ...d.signs.map(s=>s.en), d.warn?.en || ""].join(". ");
}
function retrieve(step1){
  const obsWords = words((step1.observed || []).join(" ") + " " + (step1.keywords || []).join(" "));
  const signs = new Set([...(step1.sign_ids || []), ...picked]);
  const scores = D.map(d => {
    let s = 0;
    const i = (step1.candidates || []).indexOf(d.id);
    if (i >= 0) s += 6 - i;                                   // Claude's first-pass pick
    s += d.tags.filter(t => signs.has(t)).length * 1.2;        // symptom overlap
    s += overlap(obsWords, new Set(words(diseaseText(d)))) * 0.4;
    const imgs = IMGS.filter(m => m.disease === d.id);
    s += Math.max(0, ...imgs.map(m => overlap(obsWords, new Set(words(m.caption.en))))) * 0.6;
    return {d, s};
  }).filter(x => x.s > 0).sort((a,b) => b.s - a.s).slice(0, 4);
  // up to 2 photos per disease, best caption match first
  const limit = getKey() ? 8 : Math.max(0, (sampleImgMax || 1) - 1);
  const refs = [];
  for (let round = 0; round < 2; round++){
    for (const {d} of scores){
      const imgs = IMGS.filter(m => m.disease === d.id)
        .map(m => ({m, o: overlap(obsWords, new Set(words(m.caption.en)))}))
        .sort((a,b) => b.o - a.o).map(x => x.m);
      if (imgs[round] && refs.length < limit) refs.push(imgs[round]);
    }
  }
  return {diseases: scores.map(x => x.d), refs};
}

- Compare the farmer's photo with the reference photos and the knowledge base. Base your judgement only on this material.
- Rank up to 3 diseases. level is "high", "medium" or "low". These are judgements, not probabilities; never give percentages.
- Many poultry diseases look alike; say what else to check to tell them apart (other signs, deaths, age, post-mortem, lab test).
- Never give drug names with doses. For treatment, tell them to follow the app's SOP and their vet.
- If Newcastle disease or avian influenza is possible, set urgent true.
- If nothing fits, return an empty results list.
- ref must be one of the reference ids listed above, or null.
- Write why/check/summary/answer in ${LANGNAME[lang]}, short and plain.

Reply with only this JSON:
{"summary": "one sentence on what the photo shows",
 "results": [{"disease_id": "id", "level": "high", "why": ["..."], "check": ["..."], "ref": "id or null"}],
 "answer": "direct answer to the farmer's question, or empty string",
 "urgent": false}`;
}

/* ---------- Ask AI: UI ---------- */
function setProgress(t){ const p = $("#prog"); p.classList.toggle("on", !!t); $("#progT").textContent = t || ""; }
function showErr(kind){
  const map = {net:UI.eNet, "401":UI.e401, "404":UI.e404, "429":UI.e429, none:UI.noEngine, denied:UI.eDenied, gen:UI.eGen, input:UI.needInput};
  const el = $("#askErr");
  if (!kind || kind === "cancel"){ el.classList.remove("on"); el.textContent = ""; return; }
  el.textContent = L(map[kind] || UI.eGen); el.classList.add("on");
  if (kind === "none" || kind === "401") $("#setBox").open = true;
}

async function prepPhoto(file){
  const img = await createImageBitmap(file).catch(() => null);
  if (!img) return;
  const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.85);
  userPhoto = {url, ...dataUriParts(url)};
  paintShot();
}
function paintShot(){
  const has = !!userPhoto;
  $("#shot").classList.toggle("has", has);
  $("#shotEmpty").style.display = has ? "none" : "grid";
  const im = $("#shotImg"); im.hidden = !has; if (has) im.src = userPhoto.url;
  $("#rmBtn").hidden = !has;
}

function renderAskChips(){
  $("#askChips").innerHTML = SYM.map(s => `<button class="chip" data-sym="${s[0]}" aria-pressed="${picked.has(s[0])}">${esc(L(s[2]))}</button>`).join("");
  $("#signCount").textContent = picked.size;
}

let lastResult = null;
function renderAnswer(){
  const out = $("#askOut");
  if (!lastResult){ out.innerHTML = ""; return; }
  const {step1, r} = lastResult;
  let h = "";
  if (step1.is_poultry === false) h += `<div class="callout warn"><p>${esc(L(UI.notBird))}</p></div>`;
  else if (step1.photo_quality === "poor") h += `<div class="callout warn"><p>${esc(L(UI.poorPhoto))}</p></div>`;
  if (r.urgent) h += `<div class="callout red"><p><b>${esc(L(UI.alarmText))}</b></p></div><button class="btn red" data-go="sos">${esc(L(UI.alarmBtn))}</button>`;
  if (r.summary) h += `<div class="observed"><h4>${esc(L(UI.seen))}</h4><p style="margin:0">${esc(r.summary)}</p></div>`;
  const res = (r.results || []).filter(x => D.some(d => d.id === x.disease_id)).slice(0, 3);
  h += `<h3 class="sec">${esc(L(UI.top3))}</h3>`;
  if (!res.length) h += `<div class="empty">${esc(L(UI.noResult))}</div>`;
  res.forEach((x, i) => {
    const d = D.find(d => d.id === x.disease_id);
    const lv = ["high","medium","low"].includes(x.level) ? x.level : "low";
    const lvT = L({high:UI.lvHigh, medium:UI.lvMed, low:UI.lvLow}[lv]);
    const ref = IMGS.find(m => m.id === x.ref) || IMGS.find(m => m.disease === d.id);
    h += `<article class="rcard">
      <div class="rhead"><span class="rank">${i+1}</span><span class="rname">${esc(L(d.name))}</span><span class="lvl ${lv}">${esc(lvT)}</span></div>
      <div class="rbody">
        ${x.why?.length ? `<div><h5>${esc(L(UI.why))}</h5><ul class="dots">${x.why.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
        ${x.check?.length ? `<div><h5>${esc(L(UI.tell))}</h5><ul class="dots">${x.check.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
        ${ref ? `<div><h5>${esc(L(UI.refPhoto))}</h5><div class="ref"><img src="${ref.src}" alt="${esc(L(ref.caption))}"><p>${esc(L(ref.caption))}<small>${esc(ref.source)}, PDF p.${ref.pdf_page}</small></p></div></div>` : ""}
        ${d.notify ? `<span class="pill red" style="justify-self:start">${esc(L(UI.report))}</span>` : ""}
        <button class="btn" data-open="${d.id}">${esc(L(UI.openSop))}</button>
      </div></article>`;
  });
  if (r.answer) h += `<div class="answer"><b>${esc(L(UI.answerT))}</b>\n${esc(r.answer)}</div>`;
  h += `<p class="note">${esc(L(UI.aiNote))}</p>`;
  if (res.length){
    h += `<button class="btn ghost" id="pdfBtn" data-pdf="1" style="width:100%;margin-top:14px">${esc(L(UI.pdfBtn))}</button>`;
    h += `<p class="note" id="pdfErr" style="display:none;color:var(--comb)"></p>`;
  }
  out.innerHTML = h;
}

async function runAsk(){
  const q = $("#askQ").value.trim();
  showErr(null);
  if (!userPhoto && !q && !picked.size){ showErr("input"); return; }
  if (engineState() === "none"){ showErr("none"); return; }
  askCtl = new AbortController();
  const sig = askCtl.signal;
  $("#askBtn").disabled = true;
  lastResult = null; renderAnswer();
  try {
    setProgress(L(UI.step1));
    const photoArr = userPhoto ? [{type:userPhoto.type, data:userPhoto.data}] : [];
    const step1 = await callClaude(prompt1(q), photoArr, sig, 600);
    if (step1.is_poultry === false){ lastResult = {step1, r:{results:[]}}; renderAnswer(); backupPhoto({step1}); return; }
    const ret = retrieve(step1);
    setProgress(L(UI.step2).replace("{n}", ret.refs.length));
    const imgs = [...photoArr, ...ret.refs.map(m => dataUriParts(m.src))];
    const r = await callClaude(prompt2(q, step1, ret), imgs, sig, 1800);
    lastResult = {step1, r};
    renderAnswer();
    backupPhoto({step1, r});   // fire-and-forget, now that we know what the AI concluded
    $("#askOut").scrollIntoView({behavior:"smooth", block:"start"});
  } catch(e){
    const kind = e instanceof AskError ? e.kind : "gen";
    showErr(kind);
    if (kind !== "cancel") backupPhoto({error: kind});   // still back up the photo, just note it errored
  } finally {
    setProgress(null); $("#askBtn").disabled = false; askCtl = null;
  }
}

function renderGallery(){
  $("#gallery").innerHTML = IMGS.map(m => `<button data-img="${m.id}" aria-label="${esc(L(m.caption))}"><img src="${m.src}" alt="" loading="lazy"></button>`).join("");
}
function openImage(id){
  const m = IMGS.find(x => x.id === id); if (!m) return;
  const d = D.find(x => x.id === m.disease);
  $("#dHeadT").textContent = L(d.name);
  $("#dBody").innerHTML = `<img class="bigimg" src="${m.src}" alt="${esc(L(m.caption))}">
    <h2 id="dTitle" style="margin-top:14px">${esc(L(d.name))}</h2>
    <p>${esc(L(m.caption))}</p>
    <p class="src">${esc(m.source)}, PDF p.${m.pdf_page}</p>
    <button class="btn" data-open="${d.id}">${esc(L(UI.openSop))}</button>`;
  const dlg = $("#sheet"); dlg.dataset.id = ""; if (!dlg.open) dlg.showModal();
}

function renderAskStatic(){
  $("#askQ").placeholder = L(UI.qPh);
  $("#keyIn").value = getKey();
  $("#provSel").value = getProv();
  fillModels();
  $("#eyeBtn").textContent = L($("#keyIn").type === "password" ? UI.show : UI.hide);
  $("#libNote").textContent = L(UI.libNote).replace("{n}", IMGS.length);
  $("#shotPrivacy").style.display = BACKUP_URL ? "block" : "none";
  paintEngine(); paintShot(); renderAskChips(); renderGallery(); renderAnswer();
}

function fillModels(){
  const pv = $("#provSel").value, cur = store.get("model:" + pv) || PROVIDERS[pv].models[0][0];
  const known = PROVIDERS[pv].models.some(m => m[0] === cur);
  $("#modelSel").innerHTML = PROVIDERS[pv].models.map(m => `<option value="${m[0]}">${esc(m[1])}</option>`).join("")
    + `<option value="__custom">${esc(L(UI.customModel))}</option>`;
  $("#modelSel").value = known ? cur : "__custom";
  const ci = $("#customModel");
  ci.hidden = known; ci.value = known ? "" : cur; ci.placeholder = L(UI.customPh);
}
function chosenModel(){
  return $("#modelSel").value === "__custom" ? $("#customModel").value.trim() : $("#modelSel").value;
}
function saveSettings(){
  const pv = $("#provSel").value, m = chosenModel();
  store.set("prov", pv);
  if (m) store.set("model:" + pv, m);
}
function keyMsg(t, cls){ const m = $("#keyMsg"); m.textContent = t; m.className = "msg " + (cls||""); }
$("#camBtn").addEventListener("click", () => $("#camIn").click());
$("#galBtn").addEventListener("click", () => $("#galIn").click());
["#camIn","#galIn"].forEach(s => $(s).addEventListener("change", e => { const f = e.target.files[0]; if (f) prepPhoto(f); e.target.value = ""; }));
$("#rmBtn").addEventListener("click", () => { userPhoto = null; paintShot(); });
$("#askBtn").addEventListener("click", runAsk);
$("#engine").addEventListener("click", () => { const b = $("#setBox"); b.open = true; b.scrollIntoView({behavior:"smooth", block:"start"}); });
$("#stopBtn").addEventListener("click", () => askCtl?.abort());
$("#eyeBtn").addEventListener("click", () => { const k = $("#keyIn"); k.type = k.type === "password" ? "text" : "password"; $("#eyeBtn").textContent = L(k.type === "password" ? UI.show : UI.hide); });
$("#saveKey").addEventListener("click", () => {
  const v = $("#keyIn").value.trim();
  if (!PROVIDERS[$("#provSel").value].keyRe.test(v)){ keyMsg(L(UI.keyBad), "bad"); return; }
  store.set("apikey", v); saveSettings();
  keyMsg(L(UI.keySaved), "ok"); paintEngine();
});
$("#provSel").addEventListener("change", () => { fillModels(); keyMsg(""); });
$("#modelSel").addEventListener("change", () => {
  const c = $("#modelSel").value === "__custom";
  $("#customModel").hidden = !c; if (c) $("#customModel").focus();
  if (!c && getKey()) { saveSettings(); paintEngine(); }
});
$("#customModel").addEventListener("change", () => { if (getKey() && chosenModel()) { saveSettings(); paintEngine(); } });
$("#delKey").addEventListener("click", () => {
  try { localStorage.removeItem("fp:apikey"); } catch(e){}
  $("#keyIn").value = ""; keyMsg(L(UI.keyRemoved), "ok"); paintEngine();
});
$("#testKey").addEventListener("click", async () => {
  const v = $("#keyIn").value.trim();
  if (!PROVIDERS[$("#provSel").value].keyRe.test(v)){ keyMsg(L(UI.keyBad), "bad"); return; }
  const old = getKey(), oldProv = store.get("prov"), oldModel = store.get("model:" + $("#provSel").value);
  store.set("apikey", v); saveSettings();
  keyMsg(L(UI.testing));
  try {
    await callClaude('Reply with only this JSON: {"ok": true}', [], undefined, 20);
    keyMsg(L(UI.testOk), "ok");
  } catch(e){
    keyMsg(L({net:UI.eNet, "401":UI.e401, "404":UI.e404, "429":UI.e429}[e.kind] || UI.eGen), "bad");
    try {
      if (old) store.set("apikey", old); else localStorage.removeItem("fp:apikey");
      if (oldProv) store.set("prov", oldProv); else localStorage.removeItem("fp:prov");
      const mk = "model:" + $("#provSel").value;
      if (oldModel) store.set(mk, oldModel); else localStorage.removeItem("fp:" + mk);
    } catch(_){}
  }
  paintEngine();
});

function fmtDate(s){
  const d = new Date(s.replace(" ", "T"));
  if (isNaN(d)) return s;
  const loc = {en:"en-MY", ms:"ms-MY", zh:"zh-CN"}[lang];
  return d.toLocaleString(loc, {year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
}
function showWhatsNew(){
  const c = CHANGELOG[0];
  $("#dHeadT").textContent = L(UI.newTitle);
  $("#dBody").innerHTML = `
    <span class="pill">v${esc(c.v)}</span>
    <h2 id="dTitle" style="margin-top:10px">${esc(L(UI.newTitle))}</h2>
    <p style="color:var(--muted);margin-top:0">${esc(L(UI.newUpdated).replace("{d}", fmtDate(c.date)))}</p>
    <ul class="dots" style="margin:14px 0 22px">${c.items.map(i => `<li>${esc(L(i))}</li>`).join("")}</ul>
    <button class="btn primary block" id="newOk">${esc(L(UI.gotIt))}</button>`;
  const dlg = $("#sheet"); dlg.dataset.id = ""; dlg.classList.add("pop"); if (!dlg.open) dlg.showModal();
  $("#newOk").onclick = () => dlg.close();
}
function checkWhatsNew(){
  const seen = store.get("seenVersion");
  store.set("seenVersion", APP_VERSION);
  if (seen && seen !== APP_VERSION) setTimeout(showWhatsNew, 400);   // skip on first install
}
// a new service worker took over: offer a reload
if ("serviceWorker" in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener?.("controllerchange", () => {
    if (reloading || !navigator.serviceWorker.controller) return;
    const bar = $("#updBar"); bar.hidden = false;
    bar.onclick = () => { reloading = true; location.reload(); };
  });
}

/* ---------- tabs ---------- */
function go(tab){
  document.querySelectorAll("nav.tabs [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("on", s.id === "v-"+tab));
  window.scrollTo({top:0});
  store.set("tab", tab);
}

/* ---------- theme ---------- */
const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function isDark(){
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function paintThemeBtn(){
  $("#themeBtn").innerHTML = isDark() ? sun : moon;
  document.querySelector('meta[name="theme-color"]').content = isDark() ? "#0B1A1C" : "#0F5F6B";
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.sym){ const k = t.dataset.sym; picked.has(k) ? picked.delete(k) : picked.add(k); document.querySelectorAll(`[data-sym="${k}"]`).forEach(b => b.setAttribute("aria-pressed", picked.has(k))); $("#signCount").textContent = picked.size; renderResults(); }
  else if (t.dataset.img) openImage(t.dataset.img);
  else if (t.dataset.open) openDisease(t.dataset.open);
  else if (t.dataset.tab) go(t.dataset.tab);
  else if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.filter){ filter = t.dataset.filter; renderFilters(); renderList(); }
  else if (t.dataset.lang){ lang = t.dataset.lang; store.set("lang", lang); renderAll(); }
  else if (t.dataset.pdf) exportPDF();
  else if (t.id === "clearBtn"){ picked.clear(); renderGroups(); renderResults(); renderAskChips(); }
  else if (t.id === "themeBtn"){ const next = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("theme", next); paintThemeBtn(); }
  else if (t.id === "closeSheet") $("#sheet").close();
});
$("#q").addEventListener("input", renderList);
["#mBirds","#mDead"].forEach(s => $(s).addEventListener("input", calcMort));
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.contact; if (!k) return;
  const v = e.target.value.trim(); store.set("c:"+k, v);
  const a = document.getElementById("call-"+k);
  a.href = v ? "tel:" + v.replace(/[^\d+]/g,"") : "#";
  a.setAttribute("aria-disabled", !v);
});
$("#sheet").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$("#sheet").addEventListener("close", e => e.currentTarget.classList.remove("pop"));
$("#newLink").addEventListener("click", showWhatsNew);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintThemeBtn);

/* ---------- init ---------- */
(function init(){
  const sl = store.get("lang"); if (["en","ms","zh"].includes(sl)) lang = sl;
  const st = store.get("theme"); if (st === "light" || st === "dark") document.documentElement.dataset.theme = st;
  paintThemeBtn();
  renderAll();
  checkWhatsNew();
  const tab = store.get("tab"); if (["check","ask","dis","bio","sos"].includes(tab)) go(tab);
})();
</script>
